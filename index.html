<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSCLINIC // SYSTEM TERMINAL</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap');

  * { box-sizing: border-box; }
  
  html, body {
    margin: 0;
    padding: 0;
    background-color: #030a03;
    color: #00ff66;
    font-family: 'Fira Code', 'Courier New', Courier, monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Scanline effect */
  body::before {
    content: " ";
    display: block;
    position: fixed;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
    z-index: 10;
    background-size: 100% 3px, 6px 100%;
    pointer-events: none;
  }

  #brand {
    text-align: center;
    padding: 16px 10px;
    background: #020d04;
    border-bottom: 2px solid #00ff66;
    box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
    position: relative;
  }

  #brand img {
    width: 32px;
    height: 32px;
    margin-right: 12px;
    border-radius: 50%;
    border: 1px solid #00ff66;
    vertical-align: middle;
    box-shadow: 0 0 8px #00ff66;
  }

  #brand b {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.25em;
    color: #00ff66;
    text-shadow: 0 0 8px rgba(0, 255, 102, 0.8);
    vertical-align: middle;
  }

  #wrap {
    max-width: 650px;
    margin: 40px auto;
    padding: 24px;
    background: rgba(4, 20, 8, 0.85);
    border: 1px solid #00ff66;
    border-radius: 4px;
    box-shadow: 0 0 20px rgba(0, 255, 102, 0.15), inset 0 0 10px rgba(0, 255, 102, 0.1);
    position: relative;
  }

  /* Terminal Window Controls Accent */
  #wrap::before {
    content: "> SYSTEM STATUS LOG_";
    display: block;
    font-size: 11px;
    color: #008833;
    margin-bottom: 15px;
    border-bottom: 1px dashed #005522;
    padding-bottom: 6px;
    letter-spacing: 1px;
  }

  #state {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    text-shadow: 0 0 5px #00ff66;
  }

  #det {
    font-size: 14px;
    color: #00cc55;
    margin: 0 0 10px;
    line-height: 1.6;
  }

  #det b {
    color: #ffffff;
    background: #003311;
    padding: 2px 6px;
    border-radius: 3px;
    border: 1px solid #00aa44;
    font-weight: 600;
  }

  #cache {
    font-size: 13px;
    color: #008833;
    margin: 12px 0 0;
    min-height: 18px;
    font-style: italic;
  }

  #cache.cacheok {
    color: #00ff66;
    text-shadow: 0 0 5px #00ff66;
  }

  /* Status Colors with Glowing Effects */
  .ok {
    color: #00ff66 !important;
    text-shadow: 0 0 8px rgba(0, 255, 102, 0.6);
  }

  .bad {
    color: #ff3333 !important;
    text-shadow: 0 0 8px rgba(255, 51, 51, 0.8);
  }

  .warn {
    color: #ffcc00 !important;
    text-shadow: 0 0 8px rgba(255, 204, 0, 0.8);
    animation: blink 1s infinite alternate;
  }

  @keyframes blink {
    from { opacity: 1; }
    to { opacity: 0.4; }
  }
</style>
</head>
<body>
<div id="brand">
  <img src="PSCLIMIC.PNG" alt="PSCLINIC Logo" width="32" height="32">
  <b>PSCLINIC // SYSTEM</b>
</div>

<div id="wrap">
  <div id="state">detecting firmware...</div>
  <div id="det"></div>
  <div id="cache"></div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + (supported ? " &middot; <b>supported</b>"
                     : " &middot; not in this build's kernel table");

    var target = "jb.html" + location.search;
    function go() { setState("loading jailbreak...", "warn"); location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    if (!supported) {
        setState("UNSUPPORTED FIRMWARE", "bad");
        waitForTap("UNSUPPORTED (" + (key || "unknown") + ") -- press X or tap to run anyway", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("UPDATE READY -- press X or tap to reload & run",
                   function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            waitForTap("CACHED (first run) -- press X or tap to run", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("UPDATE READY -- press X or tap to reload & run",
                       function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("CACHE FAILED -- press X or tap to run anyway", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            waitForTap("CACHE OBSOLETE -- press X or tap to run", go);
        }, false);
    }
})();
</script>
</body>
</html>
