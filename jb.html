<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PSCLINIC // EXPLOIT TERMINAL</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap');

      * { box-sizing: border-box; }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: #030a03;
        color: #00ff66;
        font-family: 'Fira Code', 'Courier New', Courier, monospace;
        overflow-x: hidden;
      }

      /* Scanline effect */
      body::before {
        content: " ";
        display: block;
        position: fixed;
        top: 0; left: 0; bottom: 0; right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
        z-index: 10;
        background-size: 100% 3px, 6px 100%;
        pointer-events: none;
      }

      #brand {
        text-align: center;
        padding: 16px 10px;
        background: #020d04;
        border-bottom: 2px solid #00ff66;
        box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
        position: relative;
        z-index: 2;
      }
      #brand img {
        width: 32px;
        height: 32px;
        margin-right: 12px;
        border-radius: 50%;
        border: 1px solid #00ff66;
        vertical-align: middle;
        box-shadow: 0 0 8px #00ff66;
      }
      #brand b {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.25em;
        color: #00ff66;
        text-shadow: 0 0 8px rgba(0, 255, 102, 0.8);
        vertical-align: middle;
      }

      /* Hacker Neon Spinner */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 50px;
        height: 50px;
        margin: -25px 0 0 -25px;
        border: 4px solid #003311;
        border-top-color: #00ff66;
        border-radius: 50%;
        box-shadow: 0 0 15px rgba(0, 255, 102, 0.5);
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 18px;
        letter-spacing: 1.5px;
        color: #ff3333;
        text-shadow: 0 0 10px rgba(255, 51, 51, 0.8);
        font-weight: bold;
        display: none;
        text-transform: uppercase;
      }

      #wrap {
        padding: 0;
      }
      #state,
      #out {
        display: none;
      }

      body.done #spin {
        display: none;
      }
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }

      /* Log Mode Styling */
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        max-width: 900px;
        margin: 20px auto;
        padding: 14px 18px;
      }
      body.log #state {
        display: block;
        font-size: 20px;
        font-weight: 700;
        margin: 0 0 12px;
        color: #00ff66;
        text-shadow: 0 0 5px #00ff66;
        text-transform: uppercase;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font-family: 'Fira Code', Consolas, monospace;
        font-size: 13px;
        line-height: 1.5;
        background: rgba(4, 20, 8, 0.9);
        border: 1px solid #00ff66;
        box-shadow: 0 0 15px rgba(0, 255, 102, 0.15), inset 0 0 10px rgba(0, 255, 102, 0.1);
        border-radius: 4px;
        padding: 14px 16px;
        height: calc(100vh - 150px);
        overflow-y: auto;
        color: #00dd55;
      }

      /* Status Colors */
      .ok {
        color: #00ff66 !important;
        text-shadow: 0 0 5px rgba(0, 255, 102, 0.5);
      }
      .bad {
        color: #ff3333 !important;
        text-shadow: 0 0 5px rgba(255, 51, 51, 0.5);
      }
      .warn {
        color: #ffcc00 !important;
        text-shadow: 0 0 5px rgba(255, 204, 0, 0.5);
      }
      .safe {
        color: #00ff66 !important;
      }
      .danger {
        color: #ff3333 !important;
      }
      code {
        color: #66ffbb;
        background: #002200;
        padding: 2px 4px;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <div id="brand">
      <img
        src="PSCLIMIC.PNG"
        alt="PSCLINIC Logo"
        width="32"
        height="32"
      /><b>PSCLINIC // EXEC</b>
    </div>
    <div id="spin"></div>
    <div id="msg">[!] RESTART YOUR CONSOLE [!]</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script type="module">
      import "./jb.js?v=10";
    </script>
  </body>
</html>
